name: Rollback (blue/green)

on:
  workflow_dispatch:
    inputs:
      color:
        description: 'Color to roll back to'
        required: true
        type: choice
        options:
          - blue
          - green

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback to ${{ github.event.inputs.color }}
    runs-on: ubuntu-latest
    steps:
      - name: Rollback over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            ./deploy/rollback.sh "${{ github.event.inputs.color }}"
